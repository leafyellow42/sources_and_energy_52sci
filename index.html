<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>다양한 발전소를 알아볼까요?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f5f1;
    --paper: #ffffff;
    --ink: #1f2328;
    --ink-soft: #57606a;
    --line: #e3e0d8;
    --accent: #2f5d8a;
    --accent-soft: #e8eff6;
    --term: #fff3c4;
    --glossary-bg: #fbf8ef;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    font-size: 18px;
    line-height: 1.85;
    word-break: keep-all;
    overflow-wrap: break-word;
  }
  .page {
    max-width: 760px;
    margin: 0 auto;
    padding: 20px 16px 48px;
  }

  /* 상단: 처음으로 */
  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    text-decoration: none;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: var(--paper);
  }
  .back:hover { background: var(--accent-soft); }

  /* 제목 */
  header { margin: 24px 0 8px; }
  header .label {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink-soft);
  }
  header h1 {
    margin: 4px 0 0;
    font-size: 40px;
    font-weight: 900;
    line-height: 1.25;
  }

  /* 본문 */
  article {
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 8px 28px 16px;
    margin-top: 20px;
  }
  section { padding: 24px 0 8px; }
  section + section { border-top: 1px solid var(--line); }
  h2 {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 0 0 16px;
    font-size: 23px;
    font-weight: 700;
    line-height: 1.4;
  }
  h2 .num {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-size: 16px;
    font-weight: 700;
    transform: translateY(-2px);
  }
  p { margin: 0 0 22px; }
  .term {
    font-weight: 700;
    background: linear-gradient(transparent 55%, var(--term) 55%);
    padding: 0 2px;
  }

  /* 사진 + 사진 설명 */
  figure { margin: 0 0 14px; }
  figure img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
  }
  .photo-slot {
    display: flex;
    align-items: center;
    justify-content: center;
    aspect-ratio: 16 / 9;
    border: 2px dashed #c9c4b8;
    border-radius: 10px;
    background: #efede7;
    color: #8a8478;
    font-size: 15px;
    text-align: center;
    padding: 16px;
  }
  figcaption {
    margin-top: 6px;
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
    text-align: center;
  }

  /* 낱말 풀이 */
  .glossary {
    margin-top: 28px;
    background: var(--glossary-bg);
    border: 1px solid var(--line);
    border-left: 6px solid #d9b44a;
    border-radius: 12px;
    padding: 18px 22px 8px;
  }
  .glossary h3 {
    margin: 0 0 10px;
    font-size: 19px;
    font-weight: 700;
  }
  .glossary dl { margin: 0; }
  .glossary .row {
    display: grid;
    grid-template-columns: 7.5em 1fr;
    gap: 12px;
    padding: 8px 0;
    border-top: 1px dashed var(--line);
    font-size: 17px;
    line-height: 1.7;
  }
  .glossary .row:first-child { border-top: none; }
  .glossary dt { font-weight: 700; }
  .glossary dd { margin: 0; }

  /* 출처 */
  .sources {
    margin-top: 28px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-soft);
  }
  .sources h3 {
    margin: 0 0 6px;
    font-size: 15px;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .sources ol { margin: 0; padding-left: 1.4em; }
  .sources a { color: var(--ink-soft); }


  .counter {
    margin-top: 36px;
    text-align: center;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .counter img { display: inline-block; height: 22px; vertical-align: middle; }
  @media (max-width: 560px) {
    body { font-size: 17px; }
    header h1 { font-size: 32px; }
    article { padding: 4px 18px 12px; }
    h2 { font-size: 20px; }
    .glossary { padding: 16px 16px 6px; }
    .glossary .row { grid-template-columns: 1fr; gap: 2px; }
  }

  .home-header { margin: 28px 0 8px; text-align: center; }
  .home-header h1 { margin: 0; font-size: 36px; font-weight: 900; line-height: 1.3; }
  .home-header p { margin: 10px 0 0; color: var(--ink-soft); font-size: 17px; }
  .home-photo { margin: 24px 0 8px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px;
    margin-top: 24px;
  }
  .card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    min-height: 76px;
    padding: 16px 20px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 14px;
    color: var(--ink);
    text-decoration: none;
    font-size: 19px;
    font-weight: 700;
    line-height: 1.4;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
    transition: transform .12s ease, border-color .12s ease, background .12s ease;
  }
  .card:hover, .card:focus-visible {
    border-color: var(--accent);
    background: var(--accent-soft);
    transform: translateY(-2px);
    outline: none;
  }
  .card { justify-content: flex-start; gap: 14px; }
  .card .name { flex: 1; }
  .card .icon {
    flex: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    border-radius: 12px;
  }
  .card .arrow { color: var(--accent); font-size: 18px; flex: none; }
  @media (max-width: 560px) {
    .home-header h1 { font-size: 28px; }
    .grid { gap: 10px; }
    .card { font-size: 16px; padding: 12px; min-height: 64px; gap: 10px; }
    .card .icon { width: 40px; height: 40px; }
    .card .arrow { display: none; }
    .card .icon svg { width: 26px; height: 26px; }
  }
</style>
</head>
